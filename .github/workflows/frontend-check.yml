name: Frontend syntax check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Python syntax without starting the model
        run: |
          python -m compileall -q app.py solar_calendar_picker.py emotion_guides.py emotion_home.py analysis.py db.py sky.py model.py quotes.py
      - name: Verify frontend module wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          solar_picker = Path("solar_calendar_picker.py").read_text(encoding="utf-8")
          assert "from emotion_calendar import page_calendar" not in app
          assert "from emotion_gallery" not in app
          assert 'st.Page(page_calendar' not in app
          assert 'st.Page(page_gallery' not in app
          assert "def demo_universe_entries" in app
          assert '("solar", "universe", "archive")' not in app
          assert "st.date_input(" not in app
          assert "st.date_input(" not in solar_picker
          assert "from solar_calendar_picker import render_solar_calendar" in app
          assert "render_solar_calendar(ym, solar_entries, on_date_open=on_solar_date)" in app
          assert "def render_solar_calendar" in solar_picker
          assert "solar_cal_day_" in solar_picker
          home = Path("emotion_home.py").read_text(encoding="utf-8")
          guides = Path("emotion_guides.py").read_text(encoding="utf-8")
          assert '"calendar": st.Page(' not in app
          assert '"gallery": st.Page(' not in app
          assert "('solar', '감정 태양계'" in home
          assert "('universe', '감정 유니버스'" in home
          assert "('archive', '나의 감정 리포트'" in home
          assert "별자리 갤러리" not in guides
          assert "def render_solar_calendar" in solar_picker
          assert "solar_cal_day_" in solar_picker
          print("Frontend syntax and wiring checks passed")
          PY

      - name: Test calendar month rollover without installing the AI model
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("solar_calendar_picker.py").read_text(encoding="utf-8"))
          function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "shift_month")
          scope = {}
          exec(compile(ast.Module(body=[function], type_ignores=[]), "solar_calendar_picker.py", "exec"), scope)
          shift = scope["shift_month"]
          assert shift("2026-11", 1) == "2026-12"
          assert shift("2026-12", 1) == "2027-01"
          assert shift("2026-01", -1) == "2025-12"
          print("Calendar month rollover checks passed")
          PY
