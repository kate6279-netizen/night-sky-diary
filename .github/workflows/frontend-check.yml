name: Frontend syntax check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Python syntax without starting the model
        run: |
          python -m compileall -q app.py emotion_calendar.py emotion_gallery.py analysis.py db.py sky.py model.py quotes.py
      - name: Verify frontend module wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          cal = Path("emotion_calendar.py").read_text(encoding="utf-8")
          gallery = Path("emotion_gallery.py").read_text(encoding="utf-8")
          sky = Path("sky.py").read_text(encoding="utf-8")
          poster = Path("templates/sky.html").read_text(encoding="utf-8")
          assert "from emotion_calendar import page_calendar" in app
          assert "from emotion_gallery import page_gallery" in app
          assert 'st.Page(page_calendar' in app
          assert 'st.Page(page_gallery' in app
          assert "def preview_entries" in cal
          assert "def page_calendar" in cal
          assert "def page_gallery" in gallery
          assert "def poster_html" in sky
          assert 'id="savePoster"' in poster
          print("Frontend syntax and wiring checks passed")
          PY
